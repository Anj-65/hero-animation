<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Hero Section</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="hero">
    <div class="content">
        <h1 id="headline">W E L C O M E &nbsp; I T Z F I Z Z</h1>

        <div class="stats">
            <div class="stat">
                <h2>95%</h2>
                <p>Customer Satisfaction</p>
            </div>

            <div class="stat">
                <h2>80%</h2>
                <p>Faster Performance</p>
            </div>

            <div class="stat">
                <h2>100%</h2>
                <p>Secure Platform</p>
            </div>
        </div>
    </div>

    <div class="image-container">
        <img src="https://picsum.photos/500/500" alt="Hero Image" id="hero-image">
    </div>
</section>

<section class="next-section">
    <h2>Scroll Down</h2>
</section>

<script src="script.js"></script>
</body>
</html>
